name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEO_RELEASE: leo-lang-v4.3.4
  DEVNODE_RELEASE: v0.2.0

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and example tests
        run: pnpm vitest run
      # Type-level assertions (`*.test-d.ts`). Package tsconfigs only include
      # `src`, so `tsc --noEmit` never reads `test/` and a `@ts-expect-error`
      # there passes silently — these need their own run to mean anything.
      - name: Type-level tests
        run: pnpm vitest --typecheck.only run
      # Every package's own sources. `pnpm vitest run` only compiles what a test
      # imports, so a package with no tests — the CLI — would otherwise ship
      # unchecked.
      - name: Typecheck packages
        run: pnpm --filter './packages/*' exec tsc --noEmit
      # Scoped to the Shield Swap examples for now. The older examples at the
      # root of examples/ have pre-existing errors — a field rename drifted past
      # them unnoticed, which is exactly what this step prevents recurring.
      - name: Typecheck examples
        run: npx tsc --noEmit -p examples/shield-swap/tsconfig.json
      - name: Typecheck reference dApp
        run: pnpm --filter @provablehq/veil-loyalty-dapp exec tsc --noEmit

  # Shape-parity check against the live testnet DEX API: the unkeyed read + auth
  # subset (public pool/token discovery, on-chain decode + Q128 tick bracketing,
  # the challenge/verify handshake with a generated account). Its job is to catch
  # drift between this client and the deployment it targets. No funded key, so
  # write/keyed assertions inside these files self-skip.
  #
  # No VEIL_DEX_API_URL: the suites derive the host from the network, so pinning
  # one here is what let this job keep testing a decommissioned deployment long
  # after the migration moved on.
  #
  # continue-on-error: an API outage must not red the whole CI run. The trade-off
  # is that a real drift failure is easy to miss — check this job when the DEX
  # client changes.
  dex-shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      VEIL_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: DEX read + auth shape parity
        run: >
          pnpm vitest run --retry=2
          packages/shield-swap/test/integration/reads.integration.test.ts
          packages/shield-swap/test/integration/api.integration.test.ts

  # Core devnode plumbing (deploy / execute / records / snapshots / codegen).
  devnode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VEIL_DEVNODE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-devnode
        with:
          leo-release: ${{ env.LEO_RELEASE }}
          devnode-release: ${{ env.DEVNODE_RELEASE }}
      # Every devnode suite binds 127.0.0.1:3030 — run the files strictly
      # sequentially so two devnodes never race for the port.
      - name: Devnode e2e tests
        run: >
          pnpm vitest run --no-file-parallelism
          packages/devnode/test/devnodeActions.integration.test.ts
          packages/provable-sdk/test/integration/devnodeE2e.test.ts
          packages/provable-sdk/test/integration/devnodeWrite.e2e.test.ts
          packages/codegen/test/integration/creditsDevnode.e2e.test.ts

  # Shield Swap AMM v3 lifecycle — heavier (deploys the ~240KB AMM), so it runs
  # as its own job, in parallel with the core devnode job on a separate runner.
  devnode-shield-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VEIL_DEVNODE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-devnode
        with:
          leo-release: ${{ env.LEO_RELEASE }}
          devnode-release: ${{ env.DEVNODE_RELEASE }}
      - name: Shield Swap AMM lifecycle e2e
        run: >
          pnpm vitest run --no-file-parallelism
          packages/shield-swap/test/integration/devnodeLifecycle.actions.e2e.test.ts
          packages/shield-swap/test/integration/devnodeLifecycle.generated.e2e.test.ts
