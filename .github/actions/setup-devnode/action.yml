name: Set up the Aleo devnode toolchain
description: >
  Installs pnpm + Node, the repo deps, and the pinned leo binary. aleo-devnode
  is not installed here — it ships as the @provablehq/aleo-devnode npm package,
  so `pnpm install` puts it in node_modules/.bin and the version is pinned in
  package.json like any other dependency.

inputs:
  leo-release:
    description: leo release tag (e.g. leo-lang-v4.3.2)
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Cache leo
      id: toolchain
      uses: actions/cache@v4
      with:
        path: ~/.aleo-tools
        key: aleo-tools-${{ inputs.leo-release }}
    - name: Install leo
      if: steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.aleo-tools
        curl -fsSL -o /tmp/leo.zip \
          "https://github.com/ProvableHQ/leo/releases/download/${{ inputs.leo-release }}/${{ inputs.leo-release }}-x86_64-unknown-linux-gnu.zip"
        unzip -o /tmp/leo.zip -d ~/.aleo-tools
        chmod +x ~/.aleo-tools/leo
    - name: Add leo to PATH
      shell: bash
      run: echo "$HOME/.aleo-tools" >> "$GITHUB_PATH"
    - name: Toolchain versions
      shell: bash
      run: |
        leo --version
        # From node_modules/.bin, which is why it is not on GITHUB_PATH: pnpm
        # puts it on PATH for the test commands that spawn it.
        pnpm exec aleo-devnode --version
